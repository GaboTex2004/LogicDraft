# ==========================================
# LOGICDRAFT - PRODUCCION
# ==========================================

# Puerto proporcionado por el proveedor de alojamiento
server.port=${PORT:8081}

# PostgreSQL: variables obligatorias
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# No modificar automaticamente el esquema en produccion
spring.jpa.hibernate.ddl-auto=validate

# Evitar imprimir consultas SQL
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Autenticacion
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Servicio de inteligencia artificial
ai.service.url=${AI_SERVICE_URL}
ai.service.timeout-seconds=${AI_SERVICE_TIMEOUT_SECONDS:420}

# Dominio real del frontend
cors.allowed-origin=${CORS_ALLOWED_ORIGIN}

# Limites de archivos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Flyway habilitado en produccion
spring.flyway.enabled=true

# Desactivar la creación del usuario predeterminado de Spring Boot
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Evitar consultas JPA durante la construcción de respuestas HTTP
spring.jpa.open-in-view=false