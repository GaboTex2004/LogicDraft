spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/diagram_db}
spring.datasource.username=${DB_USER:diagram_user}
spring.datasource.password=${DB_PASSWORD:diagram_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.timeout-seconds=${AI_SERVICE_TIMEOUT_SECONDS:600}
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Flyway permanece desactivado por defecto para no adoptar automaticamente una base local sin historial.
# Use el perfil "migrated" en bases nuevas o despues de la transicion documentada.
spring.flyway.enabled=false
